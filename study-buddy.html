<style>
  .sb-wrap{max-width:740px;margin:0 auto;padding:14px 14px 96px}
  .sb-card{background:var(--card,#fff);border:1px solid rgba(127,127,127,.22);border-radius:18px;padding:16px;margin-bottom:14px}
  .sb-map{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#0e3a4a 0%,#082032 62%,#04121f 100%);border:1px solid rgba(56,189,248,.28);margin-bottom:14px;color:#f8fafc}
  .sb-map svg{display:block;width:100%;height:auto;max-height:360px}
  .sb-map-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(4,18,31,.65);border-bottom:1px solid rgba(56,189,248,.18);font-size:13px;flex-wrap:wrap}
  .sb-live-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(16,185,129,.18);border:1px solid rgba(16,185,129,.45);color:#6ee7b7;font-weight:700;font-size:12px}
  .sb-live-dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;animation:sbpulse 1.6s infinite}
  @keyframes sbpulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.45}}
  .sb-radar{transform-origin:center;animation:sbspin 3.2s linear infinite}
  @keyframes sbspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .sb-arc{stroke-dasharray:6 5;animation:sbdash 1.2s linear infinite}
  @keyframes sbdash{to{stroke-dashoffset:-22}}
  .sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .sb-field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;opacity:.85}

  html[data-theme=night] .sb-timer{color:#2dd4bf}
  .sb-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .sb-who{padding:11px;border-radius:14px;background:rgba(15,118,110,.08);border:1px solid rgba(15,118,110,.25);text-align:center}
  .sb-who b{display:block;font-size:14.5px;margin-top:4px}
  .sb-who small{display:block;font-size:12px;opacity:.82;margin-top:2px}
  .sb-nudge-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
  .sb-nudge-toast{text-align:center;padding:8px 12px;border-radius:12px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);font-weight:700;font-size:13.5px;margin:8px 0}
  .sb-banner{padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(14,165,233,.15),rgba(15,118,110,.15));border:1px solid rgba(14,165,233,.35);text-align:center;margin-bottom:12px}
